name: Ansible CI

on:
  push:
    paths:
      - "ansible/**"
      - "ansible.cfg"
      - ".github/workflows/ci-ansible.yml"

  pull_request:
    paths:
      - "ansible/**"
      - "ansible.cfg"
      - ".github/workflows/ci-ansible.yml"

jobs:
  ansible:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tools
        run: |
          pip install ansible ansible-lint

      - name: Install Ansible requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Ansible syntax check - deploy
        run: ansible-playbook --syntax-check playbooks/deploy.yml

      - name: Ansible syntax check - provision
        run: ansible-playbook --syntax-check playbooks/provision.yml

      - name: Ansible syntax check - backup server
        run: ansible-playbook --syntax-check playbooks/backup-server.yml

      - name: Ansible lint
        run: ansible-lint .
