all:
  children:
    application_servers:
      hosts:
        onpremise-server:
          ansible_host: "192.168.8.199"
          ansible_user: ubuntu
          ansible_port: 22
          # Authentification par mot de passe : la valeur réelle est dans
          # vault.yml (chiffré). Nécessite `sshpass` sur le poste de contrôle.
          ansible_password: "{{ vault_ansible_ssh_password }}"
