- name: Provision infrastructure
  hosts: all
  become: true

  # La VM on-premise est fournie déjà provisionnée (Docker installé et
  # configuré, GPU, durcissement système). Ce playbook ne touche donc plus ni
  # aux paquets, ni à /etc/docker/daemon.json — le rôle docker_engine a été
  # retiré. Il ne reste de lui que la création des réseaux Docker partagés,
  # portée ici en pre_tasks pour qu'ils existent avant que les stacks des
  # rôles suivants ne s'y raccrochent.
  pre_tasks:
    - name: Créer les réseaux Docker externes partagés par les stacks
      community.docker.docker_network:
        name: "{{ item }}"
        state: present
      loop: "{{ docker_external_networks }}"
      tags:
        - always

  roles:
    - role: traefik
      tags:
        - traefik

    - role: garage
      tags:
        - garage

    - role: timescaledb
      tags:
        - timescaledb
        - database

    - role: monitoring
      tags:
        - monitoring

    - role: backup
      tags:
        - backup
