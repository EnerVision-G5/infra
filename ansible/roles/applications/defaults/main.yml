---
# Répertoire racine de déploiement sur l'hôte (un sous-dossier par application,
# chacun avec son propre compose.yml et son .env).
applications_dir: /opt/srv/applications

# Registre d'images. Les images sont publiées sur le GHCR de l'organisation par
# les pipelines de chaque dépôt de service.
applications_registry: ghcr.io
applications_image_namespace: "ghcr.io/enervision-g5"

# Noms des images (repository GHCR, sans tag) — suivent le nom du dépôt.
applications_front_image_name: dashboard
applications_api_image_name: api
applications_collector_image_name: collector
applications_raw_archiver_image_name: raw-archiver
applications_ingester_image_name: ingester
# Image du dépôt `database` : source de vérité du schéma. N'est pas une
# application (pas dans le catalogue) — le rôle la lance en one-shot
# `alembic upgrade head` avant de déployer les conteneurs.
applications_database_image_name: database

# --------------------------------------------------------------------------
# Versions déployées — un SHA par image. Chaque valeur est le tag GHCR immuable
# d'un commit précis (docker/metadata-action : `sha-<git-sha>`). VERSIONNÉES
# dans group_vars, jamais `latest`. Laissées vides ici pour forcer une
# définition explicite.
# --------------------------------------------------------------------------
applications_front_sha: ""
applications_api_sha: ""
applications_collector_sha: ""
applications_raw_archiver_sha: ""
applications_ingester_sha: ""
# Vide → le rôle ne joue pas la migration (schéma géré ailleurs / à la main).
applications_database_sha: ""

# Domaines publics (routage Traefik). Surchargeables dans group_vars.
applications_front_host: "app.enervision.com"
applications_api_host: "api.enervision.com"

# Ports internes exposés par chaque conteneur (cibles des services Traefik).
# Le front est servi par nginx-unprivileged (uid 101) : il ne peut pas prendre
# un port < 1024, son nginx.conf écoute donc sur 8080 (cf. dépôt dashboard).
applications_front_port: 8080
applications_api_port: 8080

# Réseaux Docker externes requis par la stack applicative (créés si absents).
#   proxy_network   : exposition via Traefik (front, api)
#   db_network      : accès à PostgreSQL (api)
#   broker_network  : bus Kafka (collector)
applications_networks:
  - proxy_network
  - api_network
  - db_network
  - broker_network

# --------------------------------------------------------------------------
# Garde-fous ressources par conteneur. La VM on-premise porte TOUTE la stack
# sur 4 vCPU / 8 Go. `cpus` est un PLAFOND (la somme sur l'hôte dépasse 4, le
# noyau arbitre), `memory` le garde-fou anti-OOM (conteneur tué s'il dépasse).
# --------------------------------------------------------------------------
applications_front_memory_limit: 96M
applications_front_cpu_limit: "0.25"

applications_api_memory_limit: 768M
applications_api_cpu_limit: "1.5"

applications_collector_memory_limit: 256M
applications_collector_cpu_limit: "0.5"

applications_raw_archiver_memory_limit: 384M
applications_raw_archiver_cpu_limit: "0.5"

# Plafonds PAR conteneur ingester (raw-ingester, enriched-ingester, site-sync).
applications_ingester_memory_limit: 384M
applications_ingester_cpu_limit: "0.5"

# Connexion applicative de l'API à la base, construite depuis les variables du
# rôle postgres (mot de passe chiffré avec ansible-vault). L'hôte `postgres`
# est le nom de conteneur du rôle, résolu sur db_network. Dialecte asyncpg
# (SQLAlchemy asynchrone).
#
# `urlencode` sur le mot de passe : s'il contient ?, !, @, /, #, : … la chaîne
# postgresql://… serait mal parsée. SQLAlchemy déchiffre ensuite le %XX.
applications_api_database_url: >-
  postgresql+asyncpg://{{ postgres_user }}:{{ postgres_password | urlencode }}@postgres:5432/{{ postgres_db }}

# --------------------------------------------------------------------------
# API — variables du .env généré (api.env.j2). Clés = celles lues par
# app/core/config.py (pydantic-settings, MAJUSCULES).
# --------------------------------------------------------------------------
applications_api_app_name: "EnerVision API"
applications_api_environment: production
applications_api_debug: false
applications_api_auth_enabled: true
applications_api_jwt_algorithm: HS256
applications_api_access_token_expire_minutes: 60

# Longueur minimale de la clé de signature, alignée sur JWT_SECRET_MIN_LENGTH
# de l'API. Vérifiée par le rôle avant tout déploiement.
applications_api_jwt_secret_min_length: 32

# Schéma sous lequel le navigateur joint les applications. Dérivé de
# l'entrypoint Traefik : aujourd'hui `web` = port 80 en clair, labels TLS
# encore commentés. Bascule seule sur `https` le jour où l'on passe à
# `websecure`, et les origines CORS / CSP suivent.
applications_public_scheme: "{{ 'https' if (traefik_entrypoint | default('web')) == 'websecure' else 'http' }}"

# Origines autorisées à appeler l'API depuis un navigateur (CORS), séparées par
# des virgules. Le front est sur une autre origine : sans cette liste le
# navigateur bloque ses requêtes. Jamais de joker.
applications_api_cors_allowed_origins: "{{ applications_public_scheme }}://{{ applications_front_host }}"

# --------------------------------------------------------------------------
# Front — configuration lue au DÉMARRAGE du conteneur, pas au build. L'image
# est construite une fois par commit et déployée telle quelle : aucun domaine
# n'y est figé. Les valeurs ci-dessous dérivent des hôtes déjà déclarés.
# --------------------------------------------------------------------------
# Origines que le navigateur peut appeler depuis le dashboard (connect-src de
# la CSP), séparées par des espaces. Symétrique de CORS côté API : l'une
# autorise l'émission, l'autre la lecture. Jamais de joker.
applications_front_csp_connect_src: "{{ applications_public_scheme }}://{{ applications_api_host }}"

# Adresse de l'API telle que le NAVIGATEUR doit la joindre — l'hôte public, pas
# le nom de service Docker.
applications_front_api_base_url: "{{ applications_public_scheme }}://{{ applications_api_host }}"

# Origine de la série prédite : api (défaut) ou fixture.
applications_front_prediction_source: "api"

# applications_api_jwt_secret : OBLIGATOIRE, sans défaut. Émis en JWT_SECRET
# (>= 32 caractères). Défini dans group_vars par indirection Vault.

# --------------------------------------------------------------------------
# Collector (dépôt `collector`) — poller : interroge l'API mock au fil de l'eau
# et pousse les mesures dans Kafka. Processus long, sans port ni route.
#
# Configuration via le .env généré (collector.env.j2), lue par le code
# (os.getenv). Le mock-api n'est pas un conteneur : c'est une adresse sur le
# réseau de l'hôte — le collector la joint donc directement, pas par un réseau
# Docker interne.
# --------------------------------------------------------------------------
applications_collector_networks:
  - broker_network

# API source des mesures — OBLIGATOIRE, sans repli utilisable. Renseignée dans
# group_vars (elle change d'un environnement à l'autre).
applications_collector_mock_api_url: "http://mock-api:8000"
applications_collector_kafka_bootstrap: "kafka:9092"
applications_collector_kafka_topic: "energy.data.raw"
applications_collector_poll_interval: 60
# Sites interrogés, séparés par des virgules.
applications_collector_sites: "SITE001,SITE002,SITE003,SITE004,SITE005"

# --------------------------------------------------------------------------
# ingester (dépôt `ingester`) — trois services, une image :
#   raw-ingester      energy.data.raw      → energy_readings (insert)
#   enriched-ingester energy.data.enriched → energy_readings (update, Flink)
#   site-sync         one-shot : complète `sites` depuis GET /api/v1/sites
#
# Les modèles SQLAlchemy viennent de l'image `database` (COPY --from), pas
# déclarés ici. Le schéma doit être appliqué (dépôt `database`) avant que
# l'ingester ne serve à quelque chose.
# --------------------------------------------------------------------------
applications_ingester_database_url: >-
  postgresql+psycopg://{{ postgres_user }}:{{ postgres_password | urlencode }}@postgres:5432/{{ postgres_db }}
# Lu par alembic/env.py du conteneur `database` — qui passe l'URL dans
# ConfigParser (set_main_option). Le mot de passe BRUT : un `%XX` de urlencode
# y serait pris pour de l'interpolation. SQLAlchemy tolère les `?`/`!` bruts
# dans la position mot de passe (regex `[^@]*` jusqu'au `@`).
applications_database_migrate_url: >-
  postgresql+psycopg://{{ postgres_user }}:{{ postgres_password }}@postgres:5432/{{ postgres_db }}
applications_ingester_kafka_bootstrap: "kafka:9092"
applications_ingester_raw_topic: "energy.data.raw"
applications_ingester_raw_group_id: "energy-readings-ingester"
applications_ingester_enriched_topic: "energy.data.enriched"
applications_ingester_enriched_group_id: "energy-readings-enriched-ingester"
# API source du référentiel (site-sync). Par défaut la même que le collector.
applications_ingester_mock_api_url: >-
  {{ applications_collector_mock_api_url | default('http://mock-api:8000') }}
# site-sync est un one-shot : le mettre à false pour un déploiement où le
# référentiel est déjà à jour (il se rejoue de toute façon à chaque bump de sha).
applications_ingester_site_sync_enabled: true

# --------------------------------------------------------------------------
# Identités applicatives Azure — accès aux blobs SANS clé de compte, par
# fédération d'identité (cf. terraform/docs/identites-applicatives.md).
# Le service signe un JWT court avec la clé privée de l'émetteur de
# l'environnement ; Entra ID l'échange contre l'identité managée `api-rw`
# (écriture) ou `api-ro` (lecture).
#
# Ces valeurs sont communes à tous les services blob ; seuls le client_id et
# le subject changent d'un service à l'autre (renseignés en group_vars).
# --------------------------------------------------------------------------
# applications_workload_key : contenu PEM de la clé privée. Pas de défaut
# (secret) — rattaché en group_vars par indirection Vault. Le rôle l'écrit
# dans /opt/srv/applications/<name>/issuer.pem (0600) pour les services dont
# le catalogue porte `workload_key: true`, et le monte en lecture seule.
applications_workload_key_filename: "issuer.pem"
applications_workload_key_path_in_container: "/run/secrets/issuer-dev.pem"

# Renseignés en group_vars (sorties Terraform de l'environnement).
applications_azure_tenant_id: ""
applications_workload_issuer: ""
applications_workload_kid: ""
applications_blob_account_url: ""
applications_blob_container: ""

# --------------------------------------------------------------------------
# raw-archiver (dépôt `raw-archiver`) — consomme energy.data.raw et archive en
# Parquet sur Azure Blob (<container>/raw/dt=…/…parquet). Processus long, sans
# port. Écrit → identité `api-rw`.
# --------------------------------------------------------------------------
applications_raw_archiver_networks:
  - broker_network
applications_raw_archiver_kafka_bootstrap: "kafka:9092"
applications_raw_archiver_kafka_topic: "energy.data.raw"
applications_raw_archiver_kafka_group_id: "raw-archiver"
applications_raw_archiver_blob_prefix: "raw"
# Flush du buffer vers le blob : dès qu'une des deux limites est atteinte.
applications_raw_archiver_flush_interval_seconds: 300
applications_raw_archiver_flush_max_rows: 5000
# Identité demandée (api-rw = écriture) et sujet du jeton — renseignés en
# group_vars depuis `terraform output workload_identities`.
applications_raw_archiver_azure_client_id: ""
applications_raw_archiver_workload_subject: ""

# --------------------------------------------------------------------------
# Catalogue des applications connues. Le nom sert de sous-dossier et de préfixe
# de template (<name>.compose.yml.j2, <name>.env.j2).
#
# kind :
#   web    — service HTTP exposé derrière Traefik (front, api) ;
#   worker — processus long sans port ni route (collector, raw-archiver).
# workload_key: true → le rôle dépose issuer.pem et le compose le monte.
# --------------------------------------------------------------------------
applications_services_catalog:
  - name: front
    kind: web
    image: "{{ applications_image_namespace }}/{{ applications_front_image_name }}:{{ applications_front_sha }}"
    sha: "{{ applications_front_sha }}"
  - name: api
    kind: web
    image: "{{ applications_image_namespace }}/{{ applications_api_image_name }}:{{ applications_api_sha }}"
    sha: "{{ applications_api_sha }}"
  - name: collector
    kind: worker
    image: "{{ applications_image_namespace }}/{{ applications_collector_image_name }}:{{ applications_collector_sha }}"
    sha: "{{ applications_collector_sha }}"
  - name: raw-archiver
    kind: worker
    image: "{{ applications_image_namespace }}/{{ applications_raw_archiver_image_name }}:{{ applications_raw_archiver_sha }}"
    sha: "{{ applications_raw_archiver_sha }}"
    workload_key: true
    # uid du conteneur (Dockerfile : useradd --uid 10001 archiver) — la clé
    # privée montée doit lui appartenir, sinon PermissionError à la lecture.
    workload_key_uid: 10001
  # Une entrée, trois conteneurs (voir ingester.compose.yml.j2).
  - name: ingester
    kind: worker
    image: "{{ applications_image_namespace }}/{{ applications_ingester_image_name }}:{{ applications_ingester_sha }}"
    sha: "{{ applications_ingester_sha }}"

# Applications effectivement déployées. Filtre le catalogue : une application
# absente n'est ni configurée, ni tirée, ni démarrée. Surchargeable dans
# group_vars.
applications_enabled:
  - front
  - api
  - collector
  - raw-archiver
  - ingester

# Liste consommée par les tasks : le catalogue restreint aux applications
# activées, dans l'ordre du catalogue.
applications_services: "{{ applications_services_catalog | selectattr('name', 'in', applications_enabled) | list }}"
