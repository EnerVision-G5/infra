---
# Répertoire racine de déploiement sur l'hôte (un sous-dossier par application,
# chacun avec son propre compose.yml et son .env).
applications_dir: /opt/srv/applications

# Registre d'images. Les images applicatives sont publiées sur le GHCR de
# l'organisation par les pipelines des dépôts dashboard / api / predict.
applications_registry: ghcr.io
applications_image_namespace: "ghcr.io/enervision-g5"

# Noms des images (repository GHCR, sans tag). Ils suivent le nom du dépôt qui
# publie l'image : le front est servi par le dépôt « dashboard », pas « front ».
applications_front_image_name: dashboard
applications_api_image_name: api
applications_predict_image_name: predict

# --------------------------------------------------------------------------
# Versions déployées — un SHA distinct par application.
#
# Chaque valeur est le tag GHCR immuable d'un commit précis (généré par
# docker/metadata-action : `sha-<git-sha>`). Ces variables sont VERSIONNÉES
# dans le dépôt (group_vars/all.yml) et mises à jour à chaque release : c'est
# le dépôt qui référence la version déployée, jamais `latest`.
#
# Laissées vides ici volontairement pour forcer une définition explicite.
# --------------------------------------------------------------------------
applications_front_sha: ""
applications_api_sha: ""
applications_predict_sha: ""

# Domaines publics (routage Traefik). Surchargeables dans group_vars.
applications_front_host: "app.enervision.com"
applications_api_host: "api.enervision.com"
applications_predict_host: "predict.enervision.com"

# Ports internes exposés par chaque conteneur (cibles des services Traefik).
applications_front_port: 80
applications_api_port: 8080
applications_predict_port: 8000

# Réseaux Docker externes requis par la stack applicative (créés si absents).
#   proxy_network : exposition via Traefik
#   db_network    : accès à TimescaleDB (api, predict)
#   ml_network    : appels internes api <-> predict
applications_networks:
  - proxy_network
  - db_network
  - ml_network

# Connexion applicative à la base (construite à partir des variables du rôle
# timescaledb ; le mot de passe vient de group_vars chiffré avec ansible-vault).
#
# Deux dialectes, non interchangeables :
#  - l'API ouvre la base avec SQLAlchemy asynchrone -> asyncpg ;
#  - les jobs batch de predict (collector, etl, training) l'ouvrent en
#    synchrone via psycopg. Le service serving, lui, ne touche pas la base.
applications_api_database_url: >-
  postgresql+asyncpg://{{ timescaledb_user }}:{{ timescaledb_password }}@timescaledb:5432/{{ timescaledb_db }}
# Non consommé aujourd'hui (serving ne lit pas la base) : prêt pour le jour où
# collector / etl / training seront déployés, avec le bon dialecte psycopg.
applications_predict_database_url: >-
  postgresql+psycopg://{{ timescaledb_user }}:{{ timescaledb_password }}@timescaledb:5432/{{ timescaledb_db }}

# --------------------------------------------------------------------------
# API — variables du fichier .env généré (api.env.j2). Noms des clés = ceux
# lus par app/core/config.py (pydantic-settings, MAJUSCULES).
# --------------------------------------------------------------------------
applications_api_app_name: "EnerVision API"
applications_api_environment: production
applications_api_debug: false
# true : les endpoints protégés exigent un JWT valide (défaut de l'API, et le
# seul réglage acceptable en production).
applications_api_auth_enabled: true
applications_api_jwt_algorithm: HS256
applications_api_access_token_expire_minutes: 60
# applications_api_jwt_secret : OBLIGATOIRE, sans valeur par défaut. Émis en
# JWT_SECRET, doit faire au moins 32 caractères sinon l'API refuse de
# démarrer. Défini dans group_vars par indirection Vault.

# --------------------------------------------------------------------------
# Predict (service serving) — variables du fichier .env généré
# (predict.env.j2). La config predict est un YAML en couches
# (conf/base.yaml + conf/${PREDICT_ENV}.yaml) ; le .env ne fournit que les
# ${VARIABLE} que ce YAML résout dans l'environnement.
# --------------------------------------------------------------------------
applications_predict_env: production
# Racine des partitions de variables produites par l'ETL. Chemin local en
# dev, URI s3:// vers Garage en déploiement.
applications_predict_storage_root: "data"
applications_predict_mlflow_tracking_uri: "http://mlflow:5000"
# Alias MLflow du modèle servi. Le déplacer dans le registre suffit à
# promouvoir une version, sans redéployer le service.
applications_predict_serving_model_uri: "models:/enervision_xgboost@champion"

# Applications effectivement déployées. Filtre le catalogue ci-dessous : une
# application absente de cette liste n'est ni configurée, ni tirée, ni démarrée.
# Permet de déployer front + api sans dépendre d'une image predict encore
# inexistante. Surchargeable dans group_vars.
applications_enabled:
  - front
  - api
  - predict

# Catalogue de toutes les applications connues. Le nom sert aussi de
# sous-dossier et de préfixe de template (<name>.compose.yml.j2, <name>.env.j2).
applications_services_catalog:
  - name: front
    image: "{{ applications_image_namespace }}/{{ applications_front_image_name }}:{{ applications_front_sha }}"
    sha: "{{ applications_front_sha }}"
  - name: api
    image: "{{ applications_image_namespace }}/{{ applications_api_image_name }}:{{ applications_api_sha }}"
    sha: "{{ applications_api_sha }}"
  - name: predict
    image: "{{ applications_image_namespace }}/{{ applications_predict_image_name }}:{{ applications_predict_sha }}"
    sha: "{{ applications_predict_sha }}"

# Liste consommée par les tasks : le catalogue restreint aux applications
# activées, dans l'ordre du catalogue.
applications_services: "{{ applications_services_catalog | selectattr('name', 'in', applications_enabled) | list }}"
