---
- name: Vérifier que la clé de signature des JWT est utilisable
  ansible.builtin.assert:
    that:
      - applications_api_jwt_secret | default('') | length
        >= applications_api_jwt_secret_min_length
    fail_msg: >-
      applications_api_jwt_secret est absente ou fait moins de
      {{ applications_api_jwt_secret_min_length }} caractères. L'API refuse de
      démarrer sans elle : le conteneur sortirait en erreur au lieu de servir.
      La définir dans le vault, jamais en clair dans le dépôt.
    quiet: true
  no_log: true

- name: Vérifier que les origines CORS ne sont pas permissives
  ansible.builtin.assert:
    that:
      - applications_api_cors_allowed_origins | default('') | length > 0
      - "'*' not in applications_api_cors_allowed_origins"
    fail_msg: >-
      applications_api_cors_allowed_origins doit lister les origines
      autorisées. Un joker rendrait l'API lisible depuis n'importe quel site.
    quiet: true

- name: Restreindre la liste aux applications qui portent leur propre version
  ansible.builtin.set_fact:
    applications_versioned: >-
      {{ applications_services | selectattr('versioned', 'defined')
         | selectattr('versioned') | list }}

- name: Vérifier que chaque application référence un SHA versionné
  ansible.builtin.assert:
    that:
      - item.sha | length > 0
    fail_msg: >-
      L'application '{{ item.name }}' n'a pas de SHA défini. Renseigner son
      SHA dans les variables versionnées du dépôt. Une image jamais publiée
      sur GHCR n'a pas de tag à déployer : publier d'abord depuis master.
    quiet: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

# L'unicité porte sur l'image complète, nom et tag, et non sur le seul SHA :
# les services de predict sont publiés depuis un même dépôt, donc un même
# commit leur donne le même tag sans qu'il s'agisse de la même image. Seuls
# les services versionnés sont concernés, predict-cron réutilisant celle de
# l'API par construction.
- name: Vérifier l'unicité des images déployées
  ansible.builtin.assert:
    that:
      - (applications_versioned | map(attribute='image') | list | unique | length)
        == (applications_versioned | length)
    fail_msg: >-
      Deux applications versionnées pointent la même image. Chacune doit avoir
      la sienne, sans quoi une seule version se déploierait partout.
    quiet: true

- name: Créer le répertoire racine des applications
  ansible.builtin.file:
    path: "{{ applications_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Créer un répertoire de déploiement par application
  ansible.builtin.file:
    path: "{{ applications_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Créer les réseaux Docker requis par les applications
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ applications_networks }}"

- name: S'authentifier auprès du registre GHCR
  community.docker.docker_login:
    registry: "{{ applications_registry }}"
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  no_log: true

- name: Générer le fichier d'environnement de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.env.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Générer le compose.yml de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.compose.yml.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mémoriser le SHA déployé de chaque application
  ansible.builtin.copy:
    dest: "{{ applications_dir }}/{{ item.name }}/.sha"
    content: "{{ item.sha }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: applications_sha_state

- name: Déterminer les applications dont la version a changé
  ansible.builtin.set_fact:
    applications_changed: >-
      {{ applications_sha_state.results
         | selectattr('changed')
         | map(attribute='item.name')
         | list }}

- name: Récupérer depuis GHCR l'image des applications concernées
  community.docker.docker_image:
    name: "{{ item.image }}"
    source: pull
    force_source: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in applications_changed

- name: (Re)déployer chaque application via son compose dédié
  community.docker.docker_compose_v2:
    project_src: "{{ applications_dir }}/{{ item.name }}"
    project_name: "enervision-{{ item.name }}"
    files:
      - compose.yml
    env_files:
      - .env
    pull: missing
    state: present
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
