---
- name: Vérifier que la clé de signature des JWT est utilisable
  ansible.builtin.assert:
    that:
      - applications_api_jwt_secret | default('') | length
        >= applications_api_jwt_secret_min_length
    fail_msg: >-
      applications_api_jwt_secret est absente ou fait moins de
      {{ applications_api_jwt_secret_min_length }} caractères. L'API refuse de
      démarrer sans elle. La définir dans le vault, jamais en clair dans le dépôt.
    quiet: true
  no_log: true
  when: "'api' in applications_enabled"

- name: Vérifier que les origines CORS ne sont pas permissives
  ansible.builtin.assert:
    that:
      - applications_api_cors_allowed_origins | default('') | length > 0
      - "'*' not in applications_api_cors_allowed_origins"
    fail_msg: >-
      applications_api_cors_allowed_origins doit lister les origines
      autorisées. Un joker rendrait l'API lisible depuis n'importe quel site.
    quiet: true
  when: "'api' in applications_enabled"

- name: Vérifier que les origines de la CSP du front ne sont pas permissives
  ansible.builtin.assert:
    that:
      - applications_front_csp_connect_src | default('') | length > 0
      - "'*' not in applications_front_csp_connect_src"
    fail_msg: >-
      applications_front_csp_connect_src doit lister les origines que le
      dashboard a le droit d'appeler. Vide, le navigateur bloque tous ses
      appels à l'API ; avec un joker, la directive ne protège plus rien.
    quiet: true
  when: "'front' in applications_enabled"

- name: Vérifier que l'adresse de l'API vue par le navigateur est renseignée
  ansible.builtin.assert:
    that:
      - applications_front_api_base_url | default('') | length > 0
    fail_msg: >-
      applications_front_api_base_url doit porter l'hôte public de l'API.
      Sans elle, le dashboard affiche une erreur de configuration.
    quiet: true
  when: "'front' in applications_enabled"

- name: Vérifier la configuration des identités applicatives Azure
  ansible.builtin.assert:
    that:
      - applications_workload_key | default('') | length > 0
      - "'BEGIN' in applications_workload_key"
      - "'REMPLACER' not in applications_workload_key"
      - applications_azure_tenant_id | default('') | length > 0
      - applications_workload_issuer | default('') | length > 0
      - applications_workload_kid | default('') | length > 0
      - applications_blob_account_url | default('') | length > 0
      - applications_blob_container | default('') | length > 0
    fail_msg: >-
      Un service à identité applicative est activé mais la configuration Azure
      est incomplète. applications_workload_key (clé privée PEM de l'émetteur)
      va dans le vault ; les autres valeurs viennent de `terraform output`
      (workload_issuer, blob_endpoint, storage_containers) et `az account show`.
      Voir terraform/docs/identites-applicatives.md.
    quiet: true
  no_log: true
  when: applications_services | selectattr('workload_key', 'defined')
    | selectattr('workload_key') | list | length > 0

- name: Vérifier que raw-archiver a une identité et un sujet
  ansible.builtin.assert:
    that:
      - applications_raw_archiver_azure_client_id | default('') | length > 0
      - applications_raw_archiver_workload_subject | default('') | length > 0
    fail_msg: >-
      raw-archiver est activé mais applications_raw_archiver_azure_client_id /
      _workload_subject sont vides. Les prendre dans
      `terraform output workload_identities` (identité `api-rw`).
    quiet: true
  when: "'raw-archiver' in applications_enabled"

- name: Vérifier qu'au moins une application est activée
  ansible.builtin.assert:
    that:
      - applications_services | length > 0
    fail_msg: >-
      applications_enabled ne référence aucune application connue. Catalogue :
      {{ applications_services_catalog | map(attribute='name') | join(', ') }}.
    quiet: true

- name: Vérifier que chaque application référence un SHA versionné
  ansible.builtin.assert:
    that:
      - item.sha | length > 0
    fail_msg: >-
      L'application '{{ item.name }}' n'a pas de SHA défini. Renseigner
      applications_{{ item.name }}_sha dans les variables versionnées du dépôt.
    quiet: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Vérifier l'unicité des images déployées (image:tag distinct)
  ansible.builtin.assert:
    that:
      - (applications_services | map(attribute='image') | list
         | unique | length) == (applications_services | length)
    fail_msg: >-
      Deux applications activées pointent la même image au même tag. C'est le
      couple image:tag qui identifie une version déployée.
    quiet: true

- name: Créer le répertoire racine des applications
  ansible.builtin.file:
    path: "{{ applications_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Créer un répertoire de déploiement par application
  ansible.builtin.file:
    path: "{{ applications_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Créer les réseaux Docker requis par les applications
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ applications_networks }}"

- name: S'authentifier auprès du registre GHCR
  community.docker.docker_login:
    registry: "{{ applications_registry }}"
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  no_log: true

- name: Déposer la clé privée de l'émetteur pour les services à identité Azure
  ansible.builtin.copy:
    content: "{{ applications_workload_key }}"
    dest: "{{ applications_dir }}/{{ item.name }}/{{ applications_workload_key_filename }}"
    # Propriété = uid du conteneur : la clé est montée en lecture seule et lue
    # par un utilisateur non-root dans l'image.
    owner: "{{ item.workload_key_uid | default('root') }}"
    group: "{{ item.workload_key_uid | default('root') }}"
    mode: "0400"
  loop: "{{ applications_services | selectattr('workload_key', 'defined') | selectattr('workload_key') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Générer le fichier d'environnement de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.env.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Générer le compose.yml de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.compose.yml.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mémoriser le SHA déployé de chaque application
  ansible.builtin.copy:
    dest: "{{ applications_dir }}/{{ item.name }}/.sha"
    content: "{{ item.sha }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: applications_sha_state

- name: Déterminer les applications dont la version a changé
  ansible.builtin.set_fact:
    applications_changed: >-
      {{ applications_sha_state.results
         | selectattr('changed')
         | map(attribute='item.name')
         | list }}

- name: Récupérer depuis GHCR l'image des applications concernées
  community.docker.docker_image:
    name: "{{ item.image }}"
    source: pull
    force_source: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in applications_changed

# --------------------------------------------------------------------------
# Schéma de la base : source de vérité = dépôt `database`. Un conteneur
# one-shot `alembic upgrade head`, joué AVANT les conteneurs applicatifs pour
# qu'ils ne démarrent jamais sur une base sans tables. Idempotent (lit
# `alembic_version`) : rejoué à chaque deploy, ne fait rien si à jour.
# --------------------------------------------------------------------------
- name: Récupérer depuis GHCR l'image de migration `database`
  community.docker.docker_image:
    name: "{{ applications_image_namespace }}/{{ applications_database_image_name }}:{{ applications_database_sha }}"
    source: pull
    force_source: true
  when: applications_database_sha | default('') | length > 0

- name: Appliquer le schéma de la base (alembic upgrade head)
  community.docker.docker_container:
    name: enervision-db-migrate
    image: "{{ applications_image_namespace }}/{{ applications_database_image_name }}:{{ applications_database_sha }}"
    command: upgrade head
    env:
      DATABASE_URL: "{{ applications_database_migrate_url }}"
    networks:
      - name: db_network
    detach: false
    cleanup: true
    state: started
  no_log: true
  when: applications_database_sha | default('') | length > 0

- name: (Re)déployer chaque application via son compose dédié
  community.docker.docker_compose_v2:
    project_src: "{{ applications_dir }}/{{ item.name }}"
    project_name: "enervision-{{ item.name }}"
    files:
      - compose.yml
    env_files:
      - .env
    pull: missing
    state: present
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
