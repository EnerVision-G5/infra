---
- name: Vérifier que la clé de signature des JWT est utilisable
  ansible.builtin.assert:
    that:
      - applications_api_jwt_secret | default('') | length
        >= applications_api_jwt_secret_min_length
    fail_msg: >-
      applications_api_jwt_secret est absente ou fait moins de
      {{ applications_api_jwt_secret_min_length }} caractères. L'API refuse de
      démarrer sans elle : le conteneur sortirait en erreur au lieu de servir.
      La définir dans le vault, jamais en clair dans le dépôt.
    quiet: true
  no_log: true
  when: "'api' in applications_enabled"

- name: Vérifier que les origines CORS ne sont pas permissives
  ansible.builtin.assert:
    that:
      - applications_api_cors_allowed_origins | default('') | length > 0
      - "'*' not in applications_api_cors_allowed_origins"
    fail_msg: >-
      applications_api_cors_allowed_origins doit lister les origines
      autorisées. Un joker rendrait l'API lisible depuis n'importe quel site.
    quiet: true
  when: "'api' in applications_enabled"

# L'ETL publie les partitions de variables, serving les relit et training les
# apprend : sans identifiants, les trois démarrent, ne trouvent rien, et ne le
# disent qu'à la première prévision demandée.
- name: Vérifier que le stockage objet est joignable par les services predict
  ansible.builtin.assert:
    that:
      - applications_predict_s3_access_key_id | default('') | length > 0
      - applications_predict_s3_secret_access_key | default('') | length > 0
    fail_msg: >-
      applications_predict_storage_root désigne un stockage objet
      ({{ applications_predict_storage_root }}) mais aucune clé Garage n'est
      fournie. Définir applications_predict_s3_access_key_id et
      applications_predict_s3_secret_access_key dans le vault (valeurs
      produites par `garage key create`).
    quiet: true
  no_log: true
  when:
    - applications_predict_storage_root.startswith('s3://')
    - applications_enabled
      | intersect(['serving', 'training', 'etl']) | length > 0

# Le registre décide du modèle servi : déplacer un alias change les prévisions
# rendues aux clients. MLflow n'ayant aucune authentification propre, une
# route sans middleware l'ouvrirait à qui connaît le domaine.
- name: Vérifier que MLflow exposé est protégé par une authentification
  ansible.builtin.assert:
    that:
      - applications_mlflow_basic_auth_users | default('') | length > 0
    fail_msg: >-
      applications_mlflow_expose demande une route Traefik vers le registre,
      mais applications_mlflow_basic_auth_users est vide. Générer les
      identifiants avec `htpasswd -nbB <utilisateur> '<mot de passe>'` et les
      stocker dans le vault, ou laisser applications_mlflow_expose à false :
      l'interface reste alors consultable par un tunnel SSH.
    quiet: true
  no_log: true
  when:
    - "'mlflow' in applications_enabled"
    - applications_mlflow_expose | bool
- name: Vérifier que les origines de la CSP du front ne sont pas permissives
  ansible.builtin.assert:
    that:
      - applications_front_csp_connect_src | default('') | length > 0
      - "'*' not in applications_front_csp_connect_src"
    fail_msg: >-
      applications_front_csp_connect_src doit lister les origines que le
      dashboard a le droit d'appeler. Vide, le navigateur bloque tous ses
      appels à l'API ; avec un joker, la directive ne protège plus rien.
    quiet: true
  when: "'front' in applications_enabled"

- name: Vérifier que l'adresse de l'API vue par le navigateur est renseignée
  ansible.builtin.assert:
    that:
      - applications_front_api_base_url | default('') | length > 0
    fail_msg: >-
      applications_front_api_base_url doit porter l'hôte public de l'API.
      Sans elle, le dashboard affiche une erreur de configuration au lieu
      d'appeler quoi que ce soit.
    quiet: true
  when: "'front' in applications_enabled"

- name: Vérifier qu'au moins une application est activée
  ansible.builtin.assert:
    that:
      - applications_services | length > 0
    fail_msg: >-
      applications_enabled ne référence aucune application connue. Catalogue :
      {{ applications_services_catalog | map(attribute='name') | join(', ') }}.
    quiet: true

- name: Vérifier que chaque application référence un SHA versionné
  ansible.builtin.assert:
    that:
      - item.sha | length > 0
    fail_msg: >-
      L'application '{{ item.name }}' n'a pas de SHA défini. Renseigner
      applications_{{ item.name }}_sha dans les variables versionnées du dépôt.
    quiet: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

# Les applications qui empruntent l'image d'une autre en sont exclues :
# predict-cron porte le job de l'API et suit sa version par construction.
# L'unicité porte donc sur les seules applications ayant leur propre image.
- name: Restreindre le contrôle d'unicité aux applications à image propre
  ansible.builtin.set_fact:
    applications_own_image: >-
      {{ applications_services
         | rejectattr('shares_image_with', 'defined') | list }}

# Sur la référence complète et non sur le seul SHA : le dépôt predict publie
# serving, training, collector et etl depuis le même commit, qui leur donne à
# toutes le même tag sur des images distinctes. Exiger un SHA distinct
# interdirait de déployer deux de ces services au même niveau de code.
- name: Vérifier l'unicité des images déployées (image:tag distinct)
  ansible.builtin.assert:
    that:
      - (applications_own_image | map(attribute='image') | list
         | unique | length) == (applications_own_image | length)
    fail_msg: >-
      Deux applications activées pointent la même image au même tag. C'est le
      couple image:tag qui identifie une version déployée.
    quiet: true

- name: Créer le répertoire racine des applications
  ansible.builtin.file:
    path: "{{ applications_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Créer un répertoire de déploiement par application
  ansible.builtin.file:
    path: "{{ applications_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Créer les réseaux Docker requis par les applications
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ applications_networks }}"

- name: S'authentifier auprès du registre GHCR
  community.docker.docker_login:
    registry: "{{ applications_registry }}"
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  no_log: true

- name: Générer le fichier d'environnement de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.env.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# Y compris pour les traitements datés (kind: job) : leur compose n'est pas
# démarré par ce rôle, mais c'est lui que le timer systemd exécute.
- name: Générer le compose.yml de chaque application
  ansible.builtin.template:
    src: "{{ item.name }}.compose.yml.j2"
    dest: "{{ applications_dir }}/{{ item.name }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mémoriser le SHA déployé de chaque application
  ansible.builtin.copy:
    dest: "{{ applications_dir }}/{{ item.name }}/.sha"
    content: "{{ item.sha }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: applications_sha_state

- name: Déterminer les applications dont la version a changé
  ansible.builtin.set_fact:
    applications_changed: >-
      {{ applications_sha_state.results
         | selectattr('changed')
         | map(attribute='item.name')
         | list }}

- name: Récupérer depuis GHCR l'image des applications concernées
  community.docker.docker_image:
    name: "{{ item.image }}"
    source: pull
    force_source: true
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in applications_changed

# Les traitements datés en sont exclus : ils n'ont rien à maintenir en vie, et
# un `up` déclencherait un entraînement complet à chaque déploiement. Leur
# image est tirée ci-dessus, leur déclenchement est un timer systemd.
- name: (Re)déployer chaque application via son compose dédié
  community.docker.docker_compose_v2:
    project_src: "{{ applications_dir }}/{{ item.name }}"
    project_name: "enervision-{{ item.name }}"
    files:
      - compose.yml
    env_files:
      - .env
    pull: missing
    state: present
  loop: "{{ applications_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.kind != 'job'

# --------------------------------------------------------------------------
# Rattrapage daté du collector : un timer systemd qui rejoue la fenêtre
# glissante chaque nuit. Séparé du poller (compose) : ce n'est pas un
# processus long mais un `docker run --rm` ponctuel.
# --------------------------------------------------------------------------
- name: Installer les unités systemd du rattrapage collector
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - collector-backfill.service
    - collector-backfill.timer
  when: applications_collector_backfill_active | bool
  notify: Reload systemd

- name: Activer et planifier le rattrapage collector
  ansible.builtin.systemd_service:
    name: collector-backfill.timer
    enabled: true
    state: started
    daemon_reload: true
  when: applications_collector_backfill_active | bool

- name: Retirer le rattrapage collector quand il est désactivé
  ansible.builtin.systemd_service:
    name: collector-backfill.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not (applications_collector_backfill_active | bool)

- name: Retirer les unités systemd du rattrapage collector quand il est désactivé
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - collector-backfill.service
    - collector-backfill.timer
  when: not (applications_collector_backfill_active | bool)
  notify: Reload systemd

# --------------------------------------------------------------------------
# Réentraînement du modèle : même schéma, sur le compose déposé plus haut.
# Le timer est le seul à lancer l'image predict/training ; un déploiement ne
# réapprend rien, il met à jour la version que le prochain run utilisera.
# --------------------------------------------------------------------------
- name: Installer les unités systemd du réentraînement
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - training.service
    - training.timer
  when: applications_training_active | bool
  notify: Reload systemd

- name: Activer et planifier le réentraînement
  ansible.builtin.systemd_service:
    name: training.timer
    enabled: true
    state: started
    daemon_reload: true
  when: applications_training_active | bool

- name: Retirer le réentraînement quand il est désactivé
  ansible.builtin.systemd_service:
    name: training.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not (applications_training_active | bool)

- name: Retirer les unités systemd du réentraînement quand il est désactivé
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - training.service
    - training.timer
  when: not (applications_training_active | bool)
  notify: Reload systemd
