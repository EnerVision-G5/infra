---
# Répertoire de déploiement sur l'hôte (même convention que les autres rôles)
monitoring_dir: /opt/srv/monitoring

# Images épinglées
monitoring_grafana_image: "grafana/grafana:11.4.0"
monitoring_prometheus_image: "prom/prometheus:v3.1.0"
monitoring_loki_image: "grafana/loki:3.3.2"
monitoring_promtail_image: "grafana/promtail:3.3.2"
monitoring_node_exporter_image: "prom/node-exporter:v1.8.2"
monitoring_cadvisor_image: "gcr.io/cadvisor/cadvisor:v0.52.1"

# Rétention des séries Prometheus
monitoring_prometheus_retention: "15d"

# Port interne de Grafana (exposé uniquement via Traefik)
monitoring_grafana_port: 3000

# monitoring_grafana_host / monitoring_grafana_admin_user /
# monitoring_grafana_admin_password : définis dans group_vars (mot de passe
# idéalement chiffré avec ansible-vault). Pas de valeur par défaut pour le
# secret volontairement.
monitoring_grafana_admin_user: admin

# Garde-fous ressources des conteneurs. La VM on-premise porte toute la stack
# (4 vCPU / 8 Go) : ce sont des plafonds anti-contention et anti-OOM, pas des
# réservations. La somme des `cpus` de tous les conteneurs peut dépasser 4.
monitoring_grafana_memory_limit: 384M
monitoring_grafana_cpu_limit: "0.75"

monitoring_prometheus_memory_limit: 768M
monitoring_prometheus_cpu_limit: "1.0"

monitoring_loki_memory_limit: 384M
monitoring_loki_cpu_limit: "0.75"

monitoring_promtail_memory_limit: 128M
monitoring_promtail_cpu_limit: "0.25"

monitoring_node_exporter_memory_limit: 96M
monitoring_node_exporter_cpu_limit: "0.25"

monitoring_cadvisor_memory_limit: 256M
monitoring_cadvisor_cpu_limit: "0.5"
