- name: Create garage directory
  ansible.builtin.file:
    path: /opt/srv/garage
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate garage docker compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/srv/garage/compose.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Generate Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /opt/srv/garage/garage.toml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Generate garage environment file
  ansible.builtin.template:
    src: garage.env.j2
    dest: /opt/srv/garage/.env
    owner: root
    group: root
    mode: "0600"

- name: Deploy garage
  community.docker.docker_compose_v2:
    project_src: /opt/srv/garage
    files:
      - compose.yml
    env_files:
      - .env
    state: present

# --------------------------------------------------------------------------
# Bootstrap du layout : sans lui, un nœud neuf n'a aucune capacité de
# stockage et répond 503 (quorum impossible sur 0 nœud). Idempotent : ne
# fait rien dès que le layout est en version >= 1.
# --------------------------------------------------------------------------
- name: Initialiser le layout Garage (mono-nœud)
  when: garage_layout_manage | bool
  block:
    - name: Attendre que Garage réponde
      community.docker.docker_container_exec:
        container: garage
        command: /garage status
      register: garage_status
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: garage_status.rc == 0

    - name: Lire la version courante du layout Garage
      community.docker.docker_container_exec:
        container: garage
        command: /garage layout show
      register: garage_layout_show
      changed_when: false

    - name: Récupérer l'identifiant du nœud Garage
      community.docker.docker_container_exec:
        container: garage
        command: /garage node id -q
      register: garage_node_id
      changed_when: false
      when: "'Current cluster layout version: 0' in garage_layout_show.stdout"

    - name: Assigner le nœud au layout (zone + capacité)
      community.docker.docker_container_exec:
        container: garage
        command: >-
          /garage layout assign
          -z {{ garage_layout_zone }}
          -c {{ garage_layout_capacity }}
          {{ garage_node_id.stdout | trim | regex_replace('@.*$', '') }}
      changed_when: true
      when: "'Current cluster layout version: 0' in garage_layout_show.stdout"

    - name: Appliquer le layout Garage (version 1)
      community.docker.docker_container_exec:
        container: garage
        command: /garage layout apply --version 1
      changed_when: true
      when: "'Current cluster layout version: 0' in garage_layout_show.stdout"
