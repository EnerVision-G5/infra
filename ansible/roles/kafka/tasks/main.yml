---
- name: Create kafka directory
  ansible.builtin.file:
    path: "{{ kafka_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate kafka docker compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ kafka_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Generate kafka environment file
  ansible.builtin.template:
    src: kafka.env.j2
    dest: "{{ kafka_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Deploy kafka
  community.docker.docker_compose_v2:
    project_src: "{{ kafka_dir }}"
    files:
      - compose.yml
    env_files:
      - .env
    state: present
