---
# Répertoire de déploiement sur l'hôte (même convention que les autres rôles)
timescaledb_dir: /opt/srv/timescaledb

# Image épinglée = même moteur en local et sur la VM.
timescaledb_image: "timescale/timescaledb:2.17.2-pg16"

# Connexion applicative
timescaledb_db: enervision
timescaledb_user: enervision
# timescaledb_password : OBLIGATOIRE — à définir dans group_vars (idéalement
# chiffré avec ansible-vault). Aucune valeur par défaut volontairement.

# Publication du port sur l'hôte, pour l'administration psql uniquement.
# Lié à la loopback par défaut : les autres conteneurs (API, ETL) passent par
# le réseau Docker "databases", pas par le port publié.
timescaledb_bind_address: "127.0.0.1"
timescaledb_port: 5432

# Garde-fous ressources du conteneur
timescaledb_memory_limit: 2G
timescaledb_cpu_limit: "2.0"
