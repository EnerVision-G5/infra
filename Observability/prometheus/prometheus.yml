global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: pickauto_api_prod
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5030"]
        labels:
          env: prod
          app: pickauto-api

  - job_name: pickauto_api_rec
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5020"]
        labels:
          env: recette
          app: pickauto-api

  - job_name: pickauto_api_charge
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5025"]
        labels:
          env: charge
          app: pickauto-api
